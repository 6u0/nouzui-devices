<style>
/* Layout: Apple Liquid Glass (iOS/iPadOS 26-27). The 3D model is the content layer on a soft
   studio backdrop; every control floats above it as glass: a left-aligned Large Title, a capsule
   segmented control top-right, a vertical capsule slider, one grouped toolbar, a glass card.
   Shapes are concentric (outer radius = inner radius + padding); controls are capsules.
   Type is the system font: SF Pro + Hiragino Sans (ja) / PingFang TC (zh) on Apple devices. */
:root {
  --bg-top: #f5f5f7;
  --bg-bottom: #e8e8ed;
  --backdrop:
    radial-gradient(60% 50% at 70% 20%, rgba(0, 136, 255, 0.07), transparent 70%),
    radial-gradient(50% 45% at 15% 85%, rgba(255, 149, 0, 0.05), transparent 70%),
    radial-gradient(90% 80% at 45% 45%, #ffffff 0%, var(--bg-top) 45%, var(--bg-bottom) 100%);
  --label: #000000;                       /* iOS label */
  --label-2: rgba(60, 60, 67, 0.6);       /* secondaryLabel */
  --label-3: rgba(60, 60, 67, 0.3);       /* tertiaryLabel */
  --separator: rgba(60, 60, 67, 0.18);
  --fill: rgba(120, 120, 128, 0.16);      /* systemFill-ish track */
  --accent: #0088ff;                      /* systemBlue (iOS 26 tuning) */
  --accent-ink: #ffffff;
  --glass: rgba(255, 255, 255, 0.62);     /* iOS 27 default: a little less clear than 26 */
  --glass-strong: rgba(255, 255, 255, 0.78);
  --glass-edge: rgba(255, 255, 255, 0.75);
  --glass-shadow: 0 10px 34px rgba(0, 0, 0, 0.10), 0 2px 6px rgba(0, 0, 0, 0.06);
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue",
             "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --r-panel: 26px;  /* outer; inner rows use 26 - 8 = 18 */
  color-scheme: light;
}
html[lang="zh-Hant"] {
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Heiti TC",
             "Microsoft JhengHei UI", system-ui, sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; color: var(--label); font-family: var(--font-ui);
  font-size: 17px; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em;
  background: var(--backdrop);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  touch-action: none;
}
/* No page zoom at all: a double tap or pinch on a panel zoomed the page, and under Guided Access
   (kiosk use) there is no way back. touch-action does not inherit, so it goes on every element;
   panels still scroll. The 3D canvas, the sliders and the body itself keep touch-action: none. */
body * { touch-action: pan-x pan-y; }
button { font-family: inherit; color: inherit; letter-spacing: inherit; }
/* The page is one box, body, and everything is placed inside it (position: absolute), so the
   whole layout follows its size. Normally that is the viewport. In the installed app with the
   transparent status bar, iOS puts fixed content below the status bar but makes it a status bar
   too short, so it stopped short of the bottom edge; fitScreen() then sets --app-h (see there).
   Behind the status bar only the html background shows: the same backdrop, so it runs on unbroken. */
html { background: var(--backdrop); background-color: var(--bg-bottom); }  /* the colour also fills any area iOS leaves outside the page */
body { position: fixed; left: 0; top: 0; width: 100%; height: var(--app-h, 100%); }
#stage { position: absolute; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }

/* ---- Liquid Glass material ---- */
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(22px) saturate(190%); backdrop-filter: blur(22px) saturate(190%);
  border: 0.5px solid var(--glass-edge);
  box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.9), inset 0 -0.5px 0 rgba(0, 0, 0, 0.05);
  position: relative;
}
/* only the larger surfaces catch the light (iOS 27): a soft specular rim along the top edge */
.glass.lit::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0) 38%);
  mix-blend-mode: soft-light;
}
/* when the WebGL lens is drawing the glass, the DOM panes only carry text and controls */
body.gl-glass .glass { background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; border-color: transparent; box-shadow: none; }
body.gl-glass .glass.lit::before { display: none; }
@media (prefers-reduced-transparency: reduce) {
  .glass { background: #f9f9fb; -webkit-backdrop-filter: none; backdrop-filter: none; }
}

#leaders { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
#leaders path { fill: none; stroke: rgba(60, 60, 67, 0.55); stroke-width: 1; }
#leaders circle { fill: #ffffff; stroke: var(--accent); stroke-width: 2.5; }
#labels { position: absolute; inset: 0; pointer-events: none; }
.callout {
  position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer;
  display: grid; grid-template-columns: auto 1fr; column-gap: 7px; align-items: baseline;
  padding: 7px 14px 8px; border-radius: 16px; white-space: nowrap;
}
.callout .ref { font: 600 12px/1 var(--font-mono); color: var(--label-2); }
.callout b { font-size: 15px; font-weight: 600; line-height: 1.2; }
.callout small { grid-column: 2; font-size: 12px; color: var(--label-2); margin-top: 1px; }
.callout.is-on { box-shadow: var(--glass-shadow), 0 0 0 2px var(--accent); }

/* Large Title, left-aligned, straight on the content like a navigation title */
.titleblock {
  position: absolute; top: calc(18px + env(safe-area-inset-top, 0px)); left: 24px;
  display: grid; gap: 2px; pointer-events: none;
}
.titleblock .eyebrow { font-size: 13px; font-weight: 600; color: var(--label-2); letter-spacing: 0; text-transform: uppercase; }
.titleblock h1 { margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.02em; }
.titleblock .eyebrow-row { display: flex; align-items: center; gap: 10px; }
.titleblock .dims { font-size: 13px; color: var(--label-2); font-variant-numeric: tabular-nums; letter-spacing: 0; }

/* capsule segmented control */
.modes {
  position: absolute; top: calc(18px + env(safe-area-inset-top, 0px)); right: 18px;
  display: flex; gap: 2px; padding: 3px; border-radius: 999px;
}
.modes button {
  border: 0; background: transparent; font-size: 15px; font-weight: 600;
  min-height: 38px; padding: 0 20px; border-radius: 999px; cursor: pointer;
  transition: background-color .25s, box-shadow .25s, color .25s;
}
.modes button[aria-pressed="true"] { background: #ffffff; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 0.5px 1px rgba(0, 0, 0, 0.08); }
.modes.langs { top: calc(70px + env(safe-area-inset-top, 0px)); }
.modes.langs button { min-height: 30px; padding: 0 13px; font-size: 13px; }

/* vertical capsule slider; the thumb turns to clear glass while dragging */
.rail {
  position: absolute; right: 18px; top: 50%; transform: translateY(-44%);
  width: 64px; height: min(52vh, 420px); display: grid; grid-template-rows: auto 1fr auto; gap: 10px;
  justify-items: center; padding: 14px 0; border-radius: 32px;
}
.rail .cap { font-size: 13px; font-weight: 600; color: var(--label-2); text-align: center; line-height: 1.25; }
.rail .readout { font-size: 13px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; line-height: 1.2; }
.rail .readout br + * { color: var(--label-2); }
.track { position: relative; width: 44px; height: calc(100% - 44px); margin: 22px 0; touch-action: none; cursor: ns-resize; }
.track::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 6px; transform: translateX(-50%); border-radius: 3px; background: var(--fill); }
.track .fill { position: absolute; left: 50%; bottom: 0; width: 6px; transform: translateX(-50%); border-radius: 3px; background: var(--accent); }
.track .tick { display: none; }
.track .thumb {
  position: absolute; left: 50%; width: 30px; height: 40px; transform: translate(-50%, 50%);
  border-radius: 999px; background: #ffffff;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16), 0 0.5px 2px rgba(0, 0, 0, 0.12);
  transition: transform .2s, background-color .2s, width .2s, height .2s;
}
.track .thumb svg { display: none; }
.track.dragging .thumb {
  width: 38px; height: 52px; background: rgba(255, 255, 255, 0.28);
  -webkit-backdrop-filter: blur(2px) saturate(160%); backdrop-filter: blur(2px) saturate(160%);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.14), inset 0 0 0 0.5px rgba(255, 255, 255, 0.9), inset 0 1px 2px rgba(255, 255, 255, 0.9);
}
.track:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 4px; border-radius: 22px; }

/* one grouped toolbar, text buttons only */
.tools {
  position: absolute; left: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; gap: 2px; padding: 4px; border-radius: 999px; max-width: calc(100vw - 120px);
}
.chip {
  display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px;
  font-size: 15px; font-weight: 600; background: transparent; border: 0; border-radius: 999px; cursor: pointer;
  transition: background-color .2s, color .2s;
}
.chip .dot { display: none; }
.chip[aria-pressed="true"] { color: var(--accent); background: color-mix(in srgb, var(--accent) 13%, transparent); }
.chip:active, .modes button:active, .steps button:active, .tour .nav button:active { transform: scale(0.97); }
.chip:focus-visible, .modes button:focus-visible, .steps button:focus-visible, .tour .nav button:focus-visible, .sheet .close:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px;
}

/* glass card */
.sheet {
  position: absolute; right: 100px; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  width: min(370px, calc(100vw - 136px)); padding: 18px 18px 10px; border-radius: var(--r-panel);
  display: grid; gap: 6px;
}
.sheet .ref { font: 600 12px/1.2 var(--font-mono); color: var(--label-2); }
.sheet h2 { margin: 0; padding-right: 36px; font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.sheet p { margin: 2px 0 6px; font-size: 15px; line-height: 1.55; color: rgba(0, 0, 0, 0.85); }
.sheet dl { margin: 0 -8px; padding: 2px 12px; display: grid; grid-template-columns: auto 1fr; border-radius: 18px; background: rgba(255, 255, 255, 0.55); font-size: 13px; }
.sheet dt, .sheet dd { padding: 9px 0; border-bottom: 0.5px solid var(--separator); }
.sheet dt:last-of-type, .sheet dd:last-of-type { border-bottom: 0; }
.sheet dt { padding-right: 14px; color: var(--label-2); font-weight: 500; }
.sheet dd { margin: 0; min-width: 0; font-variant-numeric: tabular-nums; }
.sheet .close {
  position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border: 0; border-radius: 50%;
  background: var(--fill); color: var(--label-2); display: grid; place-items: center; cursor: pointer; font-size: 0;
}
.sheet .close::before, .sheet .close::after { content: ""; position: absolute; width: 12px; height: 2px; border-radius: 1px; background: currentColor; }
.sheet .close::before { transform: rotate(45deg); }
.sheet .close::after { transform: rotate(-45deg); }

/* how-it-works panel: a sidebar-style list + text */
.tour {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  width: min(640px, calc(100vw - 36px)); padding: 8px 8px 12px; border-radius: var(--r-panel); display: grid; gap: 8px;
}
.steps { display: flex; gap: 2px; overflow-x: auto; }
.steps button {
  flex: 1 0 auto; min-height: 40px; padding: 0 12px; border: 0; border-radius: 18px; background: transparent;
  font-size: 15px; font-weight: 500; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 10px;
}
.steps button span {
  display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
  background: var(--fill); color: var(--label-2); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.steps button[aria-current="step"] { background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--accent); font-weight: 600; }
.steps button[aria-current="step"] span { background: var(--accent); color: var(--accent-ink); }
.tour h2, .tour .flowkey, .tour p { margin: 0 10px; }
.tour h2 { margin-top: 6px; font-size: 20px; line-height: 25px; font-weight: 700; letter-spacing: -0.01em; }
.tour .flowkey { font: 500 12px/1.45 var(--font-mono); color: var(--accent); }
.tour p { font-size: 15px; line-height: 1.6; color: rgba(0, 0, 0, 0.85); max-width: 62ch; }
.demo { margin: 4px 10px 0; padding: 10px 12px; border-radius: 18px; background: rgba(255, 255, 255, 0.55); display: grid; gap: 8px; }
.demo .demo-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 600; color: var(--label-2); }
.demo .chip { min-height: 30px; padding: 0 12px; font-size: 13px; }
.demo .sliders { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; }
.demo label { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) 4.6em; align-items: center; gap: 6px; font: 600 12px/1.2 var(--font-mono); color: var(--label-2); }
.demo input[type=range] { width: 100%; accent-color: var(--accent); touch-action: none; }
.demo output { text-align: right; font-variant-numeric: tabular-nums; color: var(--label); }
.demo .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
.demo .send { min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
.demo .send.secondary { background: var(--fill); color: var(--label); }
.demo .note { font-size: 12px; color: var(--label-2); }
.tour .nav { display: flex; justify-content: space-between; gap: 8px; margin: 6px 4px 0; }
.tour .nav button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px; font-size: 15px; font-weight: 600; cursor: pointer; background: var(--fill); }
.tour .nav #tour-next { background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent); }

.loading { position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; font-weight: 600; color: var(--label-2); pointer-events: none; }

body.touring .tools, body.touring .sheet { display: none; }
@media (min-width: 900px) {
  .tour { left: 18px; transform: none; top: calc(112px + env(safe-area-inset-top, 0px)); bottom: auto; width: 320px; }
  .steps { flex-direction: column; }
  .steps button { flex: none; }
}
@media (max-width: 899px) {
  /* card sits above the toolbar instead of beside it */
  .sheet { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
}
@media (max-width: 700px) {
  .titleblock { left: 18px; }
  .titleblock h1 { font-size: 28px; line-height: 34px; }
  .rail { height: 40vh; width: 56px; right: 12px; }
  .sheet { right: 16px; left: 16px; width: auto; bottom: calc(82px + env(safe-area-inset-bottom, 0px)); }
  .modes { top: auto; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); right: 16px; }
  .modes.langs { top: calc(18px + env(safe-area-inset-top, 0px)); bottom: auto; }
  .tools { bottom: calc(82px + env(safe-area-inset-bottom, 0px)); left: 16px; }
  .tour { bottom: calc(82px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------- Part catalogue ----------
// sel: matched against each mesh's CAD assembly path (extras.path from to-glb.js, e.g.
// "M90S_ali#3/base001"); where: optional test on the mesh's centre (mm, model coordinates, z up,
// +y = back of the head) for the unnamed printed bodies. A mesh goes to the first part that takes it.
// Meshes no part claims are listed in the console after loading.
// level: explode floor, from the bottom up (see computeRises); layer: extra rise inside a floor
// anchor: 'one' = several separate units (the 6 servos): one leader dot, one signal line per unit
// cables: drawn by buildCables() — the servo leads are not in the CAD
const FRONT = (c) => c.y < -25;  // the stand and the mirror servo sit in front of the face
// every printed part is white PLA Basic: ignore the CAD's grey and paint one off-white, satin finish
// (no clear coat: at 0.08 it was invisible but ran a second specular layer over most of the screen)
const PLA = { vertexColors: false, color: 0xf3f3ef, metalness: 0, roughness: 0.52 };
const PARTS = [
  { id: 'case', ref: 'H1', name: '電子部品ケース（上部ドーム）', en: 'components_case', sel: /^components_case(_cover)?$/, finish: PLA, level: 4, ghost: true,
    desc: '頭の上に載る白いドーム。中に XIAO・サーボドライバー・頭部衝撃用のサーボ・リール・心拍センサー用のジャックが収まっています。サーボのケーブルは下側からケースの中へ入ります。',
    spec: [['材質', 'PLA Basic（ホワイト）・3Dプリント'], ['外形', '約 138 × 101 × 91 mm（ふた込み）']] },
  { id: 'xiao', ref: 'U1', name: 'XIAO nRF52840 Sense', en: 'Seeed Studio XIAO nRF52840 Sense', sub: '制御・頭脳（Bluetooth LE）', sel: /^XIAO-nRF52840/, level: 3, layer: 1, callout: true,

function mainAxis(geos) {

// Drawn after the real wiring. Each lead leaves its servo, climbs the outside of the headband to a
// back corner, runs along under the case's back window, rises straight up behind its pin and goes in
// through the window into a 3-pin connector on the PCA9685. Bundles: right corner = #0–2, left
// corner = #3–5 and #7 (its lead comes round the front). Leads bound for pins further from their
// corner run lower, so each passes under the risers of the nearer ones and no two leads cross.
// The SG90 in the case (#6) stays inside and reaches its connector from the front.
// Both ends come from the model: the servo's wire stub and the header pins (3 rows × 16).
const WIRE_COLS = [0x4a2a12, 0xc62828, 0xf08c00];  // GND brown, V+ red, signal orange
const STUB_COLS = new Set(['ff0000', 'aa5500', 'ffff00', 'ff8c00', '8c5c08', 'c7911d']);

// where a servo's lead leaves its case: end of the wire stub, its direction, and each wire's offset
function servoLead(srcs) {
  const stub = new THREE.Box3(), body = new THREE.Box3(), wires = [];
  for (const m of srcs) {
    m.geometry.computeBoundingBox();
    const c = m.userData.c, b = m.geometry.boundingBox;

  const offs = [0, 1, 2].map((k) => (wires[k] ? wires[k].clone().sub(centre).projectOnPlane(dir) : V()));

// header pin tips per channel and row (row 0 GND, 1 V+, 2 signal) and the pin direction
function headerPins(srcs) {

  for (const m of srcs) {

    m.geometry.computeBoundingBox();

    const h = u.part.hornUnits[u.key];

// Signal flow: a line through part centres plus pulses travelling along it. A path that starts at a
// part made of several units (the 6 servos) branches: one line to / from each unit. Steps that list
// 'cables' (servo numbers) run their pulses along those drawn leads instead.
const flow = new THREE.Group(); flow.visible = false; scene.add(flow);
const FLOW_N = 96, FLOW_MAX = 8, PULSES = 5;
const flowLines = Array.from({ length: FLOW_MAX }, () => {
  const line = new THREE.Line(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(new Float32Array(FLOW_N * 3), 3)),
    new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, depthTest: false }));
  line.renderOrder = 10; flow.add(line);
  line.pulses = Array.from({ length: PULSES }, () => {
    const s = new THREE.Mesh(new THREE.SphereGeometry(1.8, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false, transparent: true }));
    s.renderOrder = 11; flow.add(s); return s;
  });
  return line;
});
function updateFlow(time) {
  const s = TOUR[S.step];
  if (S.mode !== 'tour' || !s.path || s.path.length < 2) { flow.visible = false; return; }
  flow.visible = true;
  let routes;
  if (s.cables && cables.length) {
    // along the real leads: from the ESP32 to each connector, then down the cable to its servo
    const from = partPoint(byId[s.path[0]], 'mid');
    routes = s.cables.map((i) => ({ dense: true, pts: [from, ...cables[i].curve.getSpacedPoints(48).reverse().map((v) => root.localToWorld(v))] }));
  } else {
    const fork = Math.max(0, s.path.findIndex((id) => byId[id].units));
    const units = (byId[s.path[fork]].units || [null]).slice(0, FLOW_MAX);
    routes = units.map((box) => ({ pts: s.path.map((id, i) => partPoint(byId[id], 'mid', i === fork ? box : null)) }));
  }
  flowLines.forEach((line, n) => {
    const on = n < routes.length;
    line.visible = on; line.pulses.forEach((p) => { p.visible = on; });
    if (!on) return;
    const { pts, dense } = routes[n], curvePts = [];
    for (let i = 0; i < pts.length; i++) {
      curvePts.push(pts[i]);
      if (!dense && i < pts.length - 1) { const m = pts[i].clone().lerp(pts[i + 1], 0.5); m.y += 10; curvePts.push(m); }
    }
    const curve = new THREE.CatmullRomCurve3(curvePts, false, 'centripetal');
    const arr = line.geometry.attributes.position.array;
    for (let i = 0; i < FLOW_N; i++) curve.getPoint(i / (FLOW_N - 1)).toArray(arr, i * 3);
    line.geometry.attributes.position.needsUpdate = true;
    line.geometry.computeBoundingSphere();
    line.material.color.copy(ACCENT);
    line.pulses.forEach((p, k) => {
      const u = ((time * (dense ? 0.00012 : 0.00025)) + k / PULSES + n * 0.13) % 1;  // branches slightly out of step
      curve.getPoint(u, p.position);
      p.material.color.copy(ACCENT);
      p.material.opacity = Math.sin(u * Math.PI);
    });
  });
}

// ---------- Liquid Glass (WebGL) ----------
// Approach from the community web recreations (kube.io write-up, archisvaze/liquid-glass WebGL
// renderer): the 3D scene is rendered to a texture, then one full-screen pass draws every visible
// `.glass` element as a rounded-rect lens over it. The bezel follows a convex squircle profile,
// refraction offset comes from Snell's law, the body is a mip-blurred, whitened sample, and a
// directional specular rim sits on the edge. SVG backdrop filters only work in Chromium, so this
// is what makes the effect real on iPad Safari. Falls back to the CSS blur when unavailable.
const GLASS_MAX = 16;
const useGLGlass = renderer.capabilities.isWebGL2 && !matchMedia('(prefers-reduced-transparency: reduce)').matches;
const hdr = renderer.extensions.has('EXT_color_buffer_float') || renderer.extensions.has('EXT_color_buffer_half_float');
const sceneRT = new THREE.WebGLRenderTarget(1, 1, {
  samples: 4, type: hdr ? THREE.HalfFloatType : THREE.UnsignedByteType,
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, generateMipmaps: false,
});
// The frosted glass samples a blurred copy. Building mipmaps of the full-res scene every frame is
// costly on iPad, so the scene is box-filtered down to 1/4 size first and the mips are built there.
// The same LOD bias then lands on the same blur level (a 1/4-size texture starts 2 mip levels down).
const smallRT = new THREE.WebGLRenderTarget(1, 1, {
  type: hdr ? THREE.HalfFloatType : THREE.UnsignedByteType,
  minFilter: THREE.LinearMipmapLinearFilter, magFilter: THREE.LinearFilter, generateMipmaps: true,
});
const downMat = new THREE.ShaderMaterial({
  depthTest: false, depthWrite: false, blending: THREE.NoBlending,
  uniforms: { uScene: { value: sceneRT.texture }, uTexel: { value: new THREE.Vector2(1, 1) } },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() { vUv = position.xy * 0.5 + 0.5; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  // 4 bilinear taps at +-1 texel = the exact average of the 4x4 block under each output pixel
  fragmentShader: /* glsl */`
    uniform sampler2D uScene; uniform vec2 uTexel; varying vec2 vUv;
    void main() {
      gl_FragColor = 0.25 * (texture2D(uScene, vUv + vec2(-uTexel.x, -uTexel.y)) + texture2D(uScene, vUv + vec2(uTexel.x, -uTexel.y))
                           + texture2D(uScene, vUv + vec2(-uTexel.x,  uTexel.y)) + texture2D(uScene, vUv + vec2(uTexel.x,  uTexel.y)));
    }`,
});
const downScene = new THREE.Scene();
const downQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), downMat);
downQuad.frustumCulled = false;
downScene.add(downQuad);
const glassMat = new THREE.ShaderMaterial({
  depthTest: false, depthWrite: false,
  uniforms: {
    uScene: { value: sceneRT.texture }, uSmall: { value: smallRT.texture }, uRes: { value: new THREE.Vector2(1, 1) }, uDpr: { value: 1 },
    uCount: { value: 0 },
    uRects: { value: Array.from({ length: GLASS_MAX }, () => new THREE.Vector4()) },
    uRadii: { value: new Array(GLASS_MAX).fill(0) },
    uIOR: { value: 1.5 }, uThick: { value: 28 }, uBezel: { value: 18 },
    uTint: { value: 0.32 }, uSpec: { value: 0.55 }, uBlur: { value: 3.2 },
  },
  vertexShader: /* glsl */`
    void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D uScene, uSmall;
    uniform vec2 uRes; uniform float uDpr; uniform int uCount;
    uniform vec4 uRects[${GLASS_MAX}]; uniform float uRadii[${GLASS_MAX}];
    uniform float uIOR, uThick, uBezel, uTint, uSpec, uBlur;

    vec3 toLin(vec3 c) { return pow(c, vec3(2.2)); }
    // same soft studio backdrop as the CSS body background (sRGB authored, composed in linear)
    vec3 backdrop(vec2 uv) {
      vec2 p = vec2(uv.x, 1.0 - uv.y); float asp = uRes.x / uRes.y;
      float d = length((p - vec2(0.45, 0.45)) * vec2(asp, 1.0) / vec2(0.9 * asp, 0.8));
      vec3 c = mix(vec3(1.0), vec3(0.961, 0.961, 0.969), smoothstep(0.0, 0.45, d));
      c = mix(c, vec3(0.910, 0.910, 0.929), smoothstep(0.45, 1.0, d));
      float b = length((p - vec2(0.7, 0.2)) * vec2(asp, 1.0) / vec2(0.6 * asp, 0.5));
      c = mix(c, vec3(0.0, 0.533, 1.0), 0.07 * (1.0 - smoothstep(0.0, 0.7, b)));
      float o = length((p - vec2(0.15, 0.85)) * vec2(asp, 1.0) / vec2(0.5 * asp, 0.45));
      c = mix(c, vec3(1.0, 0.584, 0.0), 0.05 * (1.0 - smoothstep(0.0, 0.7, o)));
      return toLin(c);
    }
    // scene texture is premultiplied, linear, not yet tone-mapped; bias > 0 reads the blurred copy
    vec3 sceneAt(vec2 uv, float bias) {
      uv = clamp(uv, vec2(0.0), vec2(1.0));
      vec4 s = bias > 0.0 ? texture2D(uSmall, uv, bias) : texture2D(uScene, uv);
      vec3 c = s.a > 0.0001 ? toneMapping(s.rgb / s.a) : vec3(0.0);
      return c * s.a + backdrop(uv) * (1.0 - s.a);
    }
    float sdRR(vec2 p, vec2 h, float r) {
      vec2 q = abs(p) - h + r;
      return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
    }
    float surf(float t) { float s = 1.0 - t; return pow(1.0 - s * s * s * s, 0.25); }  // convex squircle

    void main() {
      vec2 frag = gl_FragCoord.xy;
      vec2 uv = frag / uRes;
      float best = 1e9, shadow = 1e9, rB = 0.0; vec2 pB = vec2(0.0), hB = vec2(1.0);
      for (int i = 0; i < ${GLASS_MAX}; i++) {
        if (i >= uCount) break;
        vec4 R = uRects[i]; float r = uRadii[i];
        vec2 p = frag - R.xy;
        float sd = sdRR(p, R.zw, r);
        if (sd < best) { best = sd; pB = p; hB = R.zw; rB = r; }
        shadow = min(shadow, sdRR(p + vec2(0.0, 5.0 * uDpr), R.zw, r));
      }
      vec3 col = sceneAt(uv, 0.0);
      // soft contact shadow below each floating pane
      float sh = exp(-max(shadow, 0.0) * max(shadow, 0.0) / (420.0 * uDpr * uDpr));
      col *= 1.0 - 0.09 * sh * step(0.0, best);

      if (best < 0.0) {
        float dist = -best;
        float bezel = max(min(uBezel * uDpr, min(rB, min(hB.x, hB.y)) - 1.0), 1.0);
        float thick = uThick * uDpr;
        float t = clamp(dist / bezel, 0.0, 1.0);
        float h = surf(t);
        float dh = (surf(min(t + 0.002, 1.0)) - h) / 0.002;
        float slope = atan(dh * thick / bezel);
        float thetaR = asin(clamp(sin(slope) / uIOR, -1.0, 1.0));
        float disp = h * thick * (tan(slope) - tan(thetaR));
        vec2 grad = normalize(vec2(sdRR(pB + vec2(0.5, 0.0), hB, rB) - best, sdRR(pB + vec2(0.0, 0.5), hB, rB) - best) + 1e-6);
        vec2 off = -grad * disp / uRes;
        // frosted body: mip blur + a few taps, slight dispersion on the bezel
        vec2 px = uDpr * 5.0 / uRes;
        vec3 g = sceneAt(uv + off, uBlur) * 0.4
               + sceneAt(uv + off + vec2( px.x,  px.y), uBlur) * 0.15
               + sceneAt(uv + off + vec2(-px.x,  px.y), uBlur) * 0.15
               + sceneAt(uv + off + vec2( px.x, -px.y), uBlur) * 0.15
               + sceneAt(uv + off + vec2(-px.x, -px.y), uBlur) * 0.15;
        float edge = 1.0 - t;
        g.r = mix(g.r, sceneAt(uv + off * 1.12, uBlur).r, edge * 0.6);
        g.b = mix(g.b, sceneAt(uv + off * 0.88, uBlur).b, edge * 0.6);
        float l = dot(g, vec3(0.2126, 0.7152, 0.0722));
        g = mix(vec3(l), g, 1.35);                       // vibrancy
        g = mix(g, vec3(1.0), uTint);                     // iOS 27: a little more opaque
        // specular rim, light from the upper left; the far edge catches a weaker bounce
        vec2 L = normalize(vec2(-0.45, 0.9));
        float rim = max(dot(grad, L), 0.0) + 0.35 * max(-dot(grad, L), 0.0);
        float fall = 1.0 - smoothstep(0.0, bezel * 0.55, dist);
        g += vec3(pow(rim * fall, 1.6) * uSpec);
        float line = smoothstep(0.0, 1.2 * uDpr, dist) * (1.0 - smoothstep(1.2 * uDpr, 2.6 * uDpr, dist));
        g += vec3(line * 0.18);
        col = mix(col, g, smoothstep(0.0, 1.2 * uDpr, dist));
      }
      gl_FragColor = linearToOutputTexel(vec4(col, 1.0));
    }`,
});
const glassScene = new THREE.Scene();
const glassQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), glassMat);
glassQuad.frustumCulled = false;
glassScene.add(glassQuad);
const glassCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const glassRadius = new WeakMap();
if (useGLGlass) document.body.classList.add('gl-glass');

// read every visible .glass element's rect (device px, y up) into the shader uniforms
function updateGlassRects() {
  const dpr = renderer.getPixelRatio(), H = VH, u = glassMat.uniforms;
  let n = 0;
  for (const el of document.querySelectorAll('.glass')) {
    if (n >= GLASS_MAX || !el.getClientRects().length) continue;
    const r = el.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) continue;
    if (!glassRadius.has(el)) glassRadius.set(el, parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0);
    const rad = Math.min(glassRadius.get(el), r.width / 2, r.height / 2);
    u.uRects.value[n].set((r.left + r.width / 2) * dpr, (H - r.top - r.height / 2) * dpr, r.width / 2 * dpr, r.height / 2 * dpr);
    u.uRadii.value[n] = rad * dpr;
    n++;
  }
  u.uCount.value = n;
}

// ---------- Shadows while only the horns turn ----------
// The demos (圧力 above all) turn servo horns every frame. Redrawing the whole shadow map for that
// (~190k triangles) made those steps stutter on iPad. So the map is kept in two layers: everything
// but the horns is drawn into a cache whenever the full map is redrawn anyway (explode, ghosting),
// and while only horns move, each frame copies the cache into the map and draws just the horns
// (a few thousand triangles) over it. A horn fragment behind the cached depth is dropped, so the
// map comes out the same as a full redraw.
const hornShadow = (() => {
  const SIZE = key.shadow.mapSize.x;
  const cache = new THREE.WebGLRenderTarget(SIZE, SIZE, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
  // what three's shadow pass draws: RGBA-packed depth, back faces of one-sided solids
  const staticMat = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, side: THREE.BackSide });
  const hornMat = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, side: THREE.BackSide });
  const uniforms = { uStatic: { value: cache.texture }, uSize: { value: new THREE.Vector2(SIZE, SIZE) } };
  hornMat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, uniforms);
    sh.fragmentShader = 'uniform sampler2D uStatic; uniform vec2 uSize;\n' + sh.fragmentShader.replace('gl_FragColor = packDepthToRGBA( fragCoordZ );',
      'if ( unpackRGBAToDepth( texture2D( uStatic, gl_FragCoord.xy / uSize ) ) < fragCoordZ ) discard;\n\t\tgl_FragColor = packDepthToRGBA( fragCoordZ );');
  };
  const copy = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
    uniforms: { uTex: { value: cache.texture } }, depthTest: false, depthWrite: false,
    vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: 'uniform sampler2D uTex; varying vec2 vUv; void main() { gl_FragColor = texture2D(uTex, vUv); }',
  }));
  copy.frustumCulled = false;
  const copyScene = new THREE.Scene().add(copy), copyCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  let ready = false;
  const horns = () => new Set(servos.flatMap((s) => [...s.pivot.children.filter((o) => o.isMesh), ...(s.linkObjs || [])]));
  // draw only the meshes `keep` accepts (shadow casters), the rest hidden for the pass
  function pass(target, material, keep, clear) {
    const hidden = [];
    scene.traverseVisible((o) => { if ((o.isMesh || o.isLine || o.isPoints) && !keep(o)) hidden.push(o); });
    hidden.forEach((o) => { o.visible = false; });
    const cc = renderer.getClearColor(new THREE.Color()), ca = renderer.getClearAlpha();
    const ac = renderer.autoClear;
    renderer.autoClear = false;  // the horn pass draws over the copied cache
    scene.overrideMaterial = material;
    renderer.setRenderTarget(target);
    if (clear) { renderer.setClearColor(0xffffff, 1); renderer.clear(); } else renderer.clearDepth();
    renderer.render(scene, key.shadow.camera);
    scene.overrideMaterial = null;
    renderer.autoClear = ac;
    renderer.setClearColor(cc, ca);
    hidden.forEach((o) => { o.visible = true; });
  }
  return {
    // the full map was just redrawn (or will be this frame): the cache is out of date
    stale() { ready = false; },
    draw() {
      if (!key.shadow.map) return false;  // no full pass yet
      const h = horns();
      if (!ready) { pass(cache, staticMat, (o) => o.isMesh && o.castShadow && !h.has(o), true); ready = true; }
      renderer.setRenderTarget(key.shadow.map);
      renderer.render(copyScene, copyCam);  // covers every texel, so the auto-clear before it is harmless
      pass(key.shadow.map, hornMat, (o) => h.has(o) && o.castShadow, false);
      renderer.setRenderTarget(null);
      return true;
    },
  };
})();

// ---------- Loop ----------
// ---------- Framing: keep the model clear of the tour card ----------
// In the tour the card covers part of the screen (left column on wide screens, bottom sheet on
// narrow ones). The picture is then slid to the middle of the free area and scaled to fit it:
// setViewOffset moves the projection centre, camera.zoom shrinks the image. The orbit target, the
// distance and whatever the user has turned or zoomed stay as they are; raycasts and the leader
// labels use the same projection, so they follow. Eases in and out like the other view moves.
const shift = { x: 0, y: 0, k: 1 }, shiftGoal = { x: 0, y: 0, k: 1 };
const railEl = document.querySelector('.rail'), titleEl = document.querySelector('.titleblock');
function shiftTarget() {
  shiftGoal.x = 0; shiftGoal.y = 0; shiftGoal.k = 1;
  if (S.mode !== 'tour' || tourEl.hidden) return;
  const W = VW, H = VH, c = tourEl.getBoundingClientRect();
  let L = 0, R = W, T = titleEl.getBoundingClientRect().bottom + 8, B = H;
  if (c.width < W * 0.6) L = c.right + 12;   // card in a column on the left
  else B = c.top - 12;                       // card along the bottom
  const r = railEl.getBoundingClientRect();
  if (r.width && r.left > W / 2) R = Math.min(R, r.left - 8);
  if (R - L < 120 || B - T < 120) return;
  shiftGoal.x = (L + R) / 2 - W / 2;
  shiftGoal.y = (T + B) / 2 - H / 2;
  // the model fills roughly the middle 70 % at home, so shrink only as far as the free area needs
  shiftGoal.k = Math.min(1, Math.max(0.6, Math.min((R - L) / W, (B - T) / H) / 0.7));
}
function applyFrame() {
  if (Math.abs(shift.x) < 0.5 && Math.abs(shift.y) < 0.5 && Math.abs(shift.k - 1) < 1e-3) camera.clearViewOffset();
  else camera.setViewOffset(VW, VH, -shift.x, -shift.y, VW, VH);
  camera.zoom = shift.k;
  camera.updateProjectionMatrix();
}
function updateFrame() {
  shiftTarget();
  const d = Math.abs(shiftGoal.x - shift.x) + Math.abs(shiftGoal.y - shift.y) + Math.abs(shiftGoal.k - shift.k) * 400;
  if (d < 0.05) return;
  const k = reduceShift ? 1 : 0.12;
  shift.x += (shiftGoal.x - shift.x) * k; shift.y += (shiftGoal.y - shift.y) * k; shift.k += (shiftGoal.k - shift.k) * k;
  if (d < 0.5) Object.assign(shift, shiftGoal);
  applyFrame();
}
const reduceShift = matchMedia('(prefers-reduced-motion: reduce)').matches;

function resize() {
  fitScreen();
  measureStage();
  camera.aspect = VW / VH;
  applyFrame();  // also refreshes the projection (the view offset is in screen px)
  renderer.setSize(VW, VH);
  const buf = renderer.getDrawingBufferSize(new THREE.Vector2());
  sceneRT.setSize(buf.x, buf.y);
  smallRT.setSize(Math.ceil(buf.x / 4), Math.ceil(buf.y / 4));
  downMat.uniforms.uTexel.value.set(1 / buf.x, 1 / buf.y);
  glassMat.uniforms.uRes.value.copy(buf);
  glassMat.uniforms.uDpr.value = renderer.getPixelRatio();
  svg.setAttribute('viewBox', `0 0 ${VW} ${VH}`);
  svg.setAttribute('width', VW); svg.setAttribute('height', VH);
}
addEventListener('resize', resize);
resize();

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastTime = 0;
// While parts keep moving (servo demo, explode) the shadow map is redrawn every other frame: that
// pass draws the whole model again, and a one-frame lag in the shadows is not visible. A pending
// redraw always lands, so shadows settle exactly when the motion stops.
let frame = 0, shadowFrame = -9;
renderer.setAnimationLoop((time) => {
  frame++;
  const dt = Math.min(0.05, (time - lastTime) / 1000); lastTime = time;
  if (servos.length) { updateServos(time, dt); if (S.mode === 'tour') syncDemo(time); }
  const k = reduce ? 1 : 0.14;
  const prevT = S.explodeShown;
  // the idle pulse keeps its own timing (1 s up, 1 s held, 1 s down): follow it exactly
  if (updatePulse(performance.now())) S.explodeShown = S.explode;
  else S.explodeShown += (S.explode - S.explodeShown) * k;
  if (Math.abs(S.explode - S.explodeShown) < 1e-4) S.explodeShown = S.explode;
  // touch the DOM only when the number changes (a write before the glass rect reads forces a layout)
  const mm = Math.round(stackRise(S.explodeShown));
  if (mm !== S.readoutMm) { S.readoutMm = mm; readout.innerHTML = `+${mm}<br>mm`; }
  if (prevT !== S.explodeShown) S.shadowDirty = true;
  updateExplode();
  // while the stack grows or shrinks, move the view by the same amount so it stays in frame.
  // Only the change is applied, so wherever the user has panned / zoomed to is kept.
  if (!fly && prevT !== S.explodeShown) {
    const dy = viewTargetY(S.explodeShown) - viewTargetY(prevT);
    controls.target.y += dy; camera.position.y += dy;
    const ratio = zoomFactor(S.explodeShown) / zoomFactor(prevT);
    camera.position.sub(controls.target).multiplyScalar(ratio).add(controls.target);
  }
  if (fly) {
    const goal = flyGoal();
    camera.position.lerp(goal, 0.12); controls.target.lerp(fly.target, 0.12);
    if (camera.position.distanceTo(goal) < 0.5 || performance.now() > fly.until) {
      // land exactly on the clock's angle, so this device stays in step from here on
      if (fly.sync) {
        const v = camera.position.clone().sub(controls.target);
        camera.position.copy(controls.target).add(v.applyAxisAngle(UP, azimuth(goal.clone().sub(fly.target)) - azimuth(v)));
      }
      fly = null;
    }
  } else if (spinning && !interacting) {
    // turn by the clock time since the last frame: the phase (and any offset a drag left) is kept
    const v = camera.position.clone().sub(controls.target);
    camera.position.copy(controls.target).add(v.applyAxisAngle(UP, spinAngle(Date.now()) - spinAngle(lastSpinMs)));
  }
  lastSpinMs = Date.now();
  controls.update();
  updateFrame();
  updateFlow(time);
  if (callouts.length) layoutCallouts();
  if (S.shadowDirty && frame - shadowFrame >= 2) {
    renderer.shadowMap.needsUpdate = true; S.shadowDirty = false; shadowFrame = frame;
    hornShadow.stale(); S.hornsMoved = false;  // the full pass draws the horns too
  } else if (S.hornsMoved && !S.shadowDirty) {
    S.hornsMoved = false;
    if (!hornShadow.draw()) S.shadowDirty = true;
  }
  if (useGLGlass) {
    renderer.setRenderTarget(sceneRT);
    renderer.setClearColor(0x000000, 0);
    renderer.clear();
    renderer.render(scene, camera);
    renderer.setRenderTarget(smallRT);
    renderer.render(downScene, glassCam);
    renderer.setRenderTarget(null);
    updateGlassRects();
    renderer.render(glassScene, glassCam);
  } else {
    renderer.render(scene, camera);
  }
});

// ---------- Back to the start after 5 minutes untouched ----------
// For a device left out on show (Guided Access): with no touch, wheel or key for IDLE_MS the page
// returns to how it opens: 観察, 繁體中文, assembled, shell solid, auto-rotate on, the home view,
// no part sheet open.
const IDLE_MS = 5 * 60 * 1000;
let idleTimer = 0;
function backToStart() {
  pulse = null;
  if (S.mode !== 'explore') setMode('explore');
  select(null);
  if (LANG !== 'en') setLang('en');
  const ghost = document.getElementById('t-ghost'), spin = document.getElementById('t-spin');
  if (ghost.getAttribute('aria-pressed') === 'true') ghost.click();
  if (spin.getAttribute('aria-pressed') !== 'true') spin.click();
  setExplode(0);
  flyHome(0);
}
// While nobody touches it, every 3–4 minutes (random each time) the stack opens to full explode and
// closes again to catch the eye: 1 s up, 1 s held, 1 s down, back to where it was. Only in 観察 (the
// tour sets its own explode per step). A touch stops it and the stack goes back to where it was.
const PULSE_MIN_MS = 3 * 60 * 1000, PULSE_MAX_MS = 4 * 60 * 1000;
let pulseTimer = 0, pulse = null;
function schedulePulse() {
  clearTimeout(pulseTimer);
  pulseTimer = setTimeout(startPulse, PULSE_MIN_MS + Math.random() * (PULSE_MAX_MS - PULSE_MIN_MS));
}
function startPulse() {
  if (S.mode === 'explore' && !pulse) pulse = { t0: performance.now(), from: S.explode };
  schedulePulse();
}
function stopPulse() { if (pulse) { setExplode(pulse.from); pulse = null; } }
// called by the render loop; true while a pulse is running (it then sets the explode itself)
function updatePulse(now) {
  if (!pulse) return false;
  const t = (now - pulse.t0) / 1000, ease = (x) => x * x * (3 - 2 * x), lift = 1 - pulse.from;
  if (t >= 3) { stopPulse(); return false; }
  setExplode(pulse.from + lift * (t < 1 ? ease(t) : t < 2 ? 1 : 1 - ease(t - 2)));
  return true;
}
function stillHere() {
  clearTimeout(idleTimer); idleTimer = setTimeout(backToStart, IDLE_MS);
  stopPulse(); schedulePulse();
}
for (const ev of ['pointerdown', 'wheel', 'keydown']) addEventListener(ev, stillHere, { capture: true, passive: true });
stillHere();

// ---------- Layout readout ----------
// Five quick taps in the top-left corner (over the title) show what iOS reports for the screen,
// viewport and safe areas (for sizing the layout box on the iPad, see fitScreen). It shows for
// READOUT_MS and then fades out in 1 s by itself, so on a kiosk it can never be left up.
const READOUT_MS = 2000;
{
  let taps = [], el = null, hideTimer = 0;
  const probe = (css) => {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;left:0;top:0;width:1px;visibility:hidden;pointer-events:none;' + css;
    document.documentElement.appendChild(d);
    const v = d.getBoundingClientRect().height; d.remove();
    return Math.round(v * 10) / 10;
  };
  const rect = (e) => { const r = e.getBoundingClientRect(); return `${Math.round(r.top)}..${Math.round(r.bottom)} (${Math.round(r.height)})`; };
  addEventListener('pointerdown', (e) => {
    if (e.clientX > 320 || e.clientY > 160) return;
    const now = performance.now();
    taps = taps.filter((t) => now - t < 2500).concat(now);
    if (taps.length < 5) return;
    taps = [];
    if (el) el.remove();
    clearTimeout(hideTimer);
    el = document.createElement('pre');
    el.style.cssText = 'position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:99;margin:0;padding:14px 18px;' +
      'max-width:min(560px,90vw);white-space:pre-wrap;background:#fff;color:#000;font:13px/1.5 ui-monospace,Menlo,monospace;border-radius:12px;box-shadow:0 6px 30px rgba(0,0,0,.25);pointer-events:none;transition:opacity 1s;';
    const vv = window.visualViewport;
    el.textContent = [
      `standalone ${navigator.standalone} / display-mode ${matchMedia('(display-mode: standalone)').matches}`,
      `screen ${screen.width} x ${screen.height}   dpr ${devicePixelRatio}`,
      `inner ${innerWidth} x ${innerHeight}`,
      `client ${document.documentElement.clientWidth} x ${document.documentElement.clientHeight}`,
      `visualViewport ${vv ? `${vv.width} x ${vv.height} top ${vv.offsetTop} scale ${vv.scale}` : '-'}`,
      `100vh ${probe('height:100vh')}  100lvh ${probe('height:100lvh')}  100svh ${probe('height:100svh')}  100dvh ${probe('height:100dvh')}`,
      `fixed 100% ${probe('position:fixed;height:100%')}`,
      `safe-area top ${probe('height:env(safe-area-inset-top,0px)')} bottom ${probe('height:env(safe-area-inset-bottom,0px)')}`,
      `--app-h ${document.documentElement.style.getPropertyValue('--app-h')}`,
      `body ${rect(document.body)}  canvas ${rect(renderer.domElement)}`,
      `tools ${rect(document.querySelector('.tools'))}  rail ${rect(document.querySelector('.rail'))}`,
      navigator.userAgent.replace(/^Mozilla\/5\.0 /, ''),
    ].join('\n');
    document.body.appendChild(el);
    const shown = el;
    hideTimer = setTimeout(() => {
      shown.style.opacity = '0';
      setTimeout(() => { shown.remove(); if (el === shown) el = null; }, 1050);
    }, READOUT_MS);
  }, { capture: true, passive: true });
}


// Safari's own pinch gesture (it can zoom the page past user-scalable=no); the 3D view's pinch
// runs on pointer events and is not affected
document.addEventListener('gesturestart', (e) => e.preventDefault());

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
