<style>
/* Layout: full-bleed 3D bench; title block top-left, vertical height-explode rail on the right,
   tool chips bottom-left, part sheet bottom-right. Callouts drawn in a drafting style. */
:root {
  --bg: #e4e8ed;
  --bg-deep: #cfd5dd;
  --panel: #f8f9fa;
  --ink: #1b2029;
  --muted: #5b6472;
  --line: rgba(27, 32, 41, 0.14);
  --accent: #0e7c86;          /* teal: callouts, active state, signal flow */
  --accent-ink: #ffffff;
  --slate: #3f4551;
  --font-ui: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  --shadow: 0 1px 2px rgba(20, 26, 34, 0.08), 0 4px 14px rgba(20, 26, 34, 0.06);
  color-scheme: light;  /* single light look, regardless of the viewer's theme */
}
[hidden] { display: none !important; }
html[lang="zh-Hant"] { --font-ui: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
.modes.langs { top: calc(72px + env(safe-area-inset-top, 0px)); }
.langs button { padding: 8px 12px; min-height: 34px; font-size: 13px; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; color: var(--ink); font-family: var(--font-ui);
  background: radial-gradient(120% 90% at 40% 35%, var(--bg) 0%, var(--bg-deep) 100%);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  touch-action: none;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }
#leaders { position: fixed; inset: 0; pointer-events: none; overflow: visible; }
#leaders path { fill: none; stroke: var(--ink); stroke-width: 1.2; opacity: .75; }
#leaders circle { fill: var(--accent); stroke: var(--bg); stroke-width: 2; }
#labels { position: fixed; inset: 0; pointer-events: none; }

.callout {
  box-shadow: var(--shadow);
  position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer;
  display: grid; grid-template-columns: auto 1fr; column-gap: 8px; align-items: baseline;
  padding: 7px 11px 8px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px;
  white-space: nowrap; transition: opacity .2s, border-color .2s;
}
.callout .ref { font: 600 11px/1 var(--font-mono); color: var(--accent); letter-spacing: .04em; }
.callout b { font: 600 14px/1.15 var(--font-mono); letter-spacing: .01em; }
.callout small { grid-column: 2; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.callout.is-on { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
.callout[hidden] { display: none !important; }

.titleblock {
  box-shadow: var(--shadow);
  position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px;
  display: grid; gap: 2px; padding: 12px 14px; background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--r);
}
.titleblock .eyebrow { font: 500 10.5px/1 var(--font-mono); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.titleblock h1 { margin: 4px 0 0; font: 700 22px/1.2 var(--font-ui); letter-spacing: .02em; text-wrap: balance; }
.titleblock .dims { font: 400 11.5px/1.4 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }

.modes {
  box-shadow: var(--shadow);
  position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px;
  display: flex; padding: 4px; gap: 4px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 9px;
}
.modes button {
  border: 0; background: transparent; color: var(--ink); font: 500 14px/1 var(--font-ui);
  padding: 11px 18px; border-radius: 6px; cursor: pointer; min-height: 40px;
}
.modes button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* Vertical height-explode rail */
.rail {
  box-shadow: var(--shadow);
  position: fixed; right: 16px; top: 50%; transform: translateY(-46%);
  width: 64px; height: min(52vh, 420px); display: grid; grid-template-rows: auto 1fr auto; gap: 10px;
  justify-items: center; padding: 12px 0; background: var(--panel); border: 1px solid var(--line);
  border-radius: 9px;
}
.rail .cap { font: 500 11px/1.2 var(--font-ui); color: var(--muted); text-align: center; }
.rail .readout { font: 600 11px/1.2 var(--font-mono); color: var(--ink); font-variant-numeric: tabular-nums; text-align: center; }
.track { position: relative; width: 44px; height: 100%; touch-action: none; cursor: ns-resize; }
.track::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; transform: translateX(-50%); border-radius: 4px; background: var(--line); }
.track .fill { position: absolute; left: 50%; bottom: 0; width: 4px; transform: translateX(-50%); border-radius: 4px; background: var(--accent); }
.track .tick { position: absolute; left: 50%; width: 14px; height: 1px; transform: translateX(-50%); background: var(--muted); opacity: .5; }
.track .thumb {
  position: absolute; left: 50%; width: 40px; height: 40px; transform: translate(-50%, 50%);
  border-radius: 9px; background: var(--accent); box-shadow: 0 2px 10px rgba(0,0,0,.25);
  display: grid; place-items: center; color: var(--accent-ink);
}
.track .thumb svg { width: 18px; height: 18px; }
.track:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 8px; }

.tools {
  position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; gap: 8px; max-width: calc(100vw - 32px);
}
.chip {
  box-shadow: var(--shadow);
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px;
  font: 500 14px/1 var(--font-ui); color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 9px; cursor: pointer;
}
.chip .dot { width: 10px; height: 10px; border-radius: 3px; border: 1.5px solid var(--muted); }
.chip[aria-pressed="true"] .dot { background: var(--accent); border-color: var(--accent); }
.chip:focus-visible, .modes button:focus-visible, .steps button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.sheet {
  box-shadow: var(--shadow);
  position: fixed; right: 96px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(360px, calc(100vw - 128px)); padding: 16px 18px 18px; background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--r);
  display: grid; gap: 8px;
}
.sheet .ref { font: 600 11px/1 var(--font-mono); color: var(--accent); letter-spacing: .08em; }
.sheet h2 { margin: 0; font: 700 18px/1.3 var(--font-ui); text-wrap: balance; }
.sheet p { margin: 0; font-size: 14px; line-height: 1.7; color: var(--ink); }
.sheet dl { margin: 4px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12.5px; }
.sheet dt { color: var(--muted); font-family: var(--font-mono); font-size: 11.5px; padding-top: 1px; }
.sheet dd { margin: 0; min-width: 0; }
.sheet .close { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; border: 0; background: transparent; color: var(--muted); font-size: 20px; cursor: pointer; border-radius: 8px; }
.sheet .note { font-size: 11.5px; color: var(--muted); }

.tour {
  box-shadow: var(--shadow);
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(640px, calc(100vw - 32px)); padding: 14px 16px 16px; background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--r); display: grid; gap: 10px;
}
.steps { display: flex; gap: 6px; overflow-x: auto; }
.steps button {
  flex: 1 0 auto; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line);
  background: transparent; color: var(--ink); font: 500 13.5px/1 var(--font-ui); cursor: pointer;
}
.steps button span { font-family: var(--font-mono); color: var(--muted); margin-right: 6px; }
.steps button[aria-current="step"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.steps button[aria-current="step"] span { color: var(--accent); }
.tour h2 { margin: 0; font: 700 17px/1.3 var(--font-ui); }
.tour p { margin: 0; font-size: 14px; line-height: 1.75; max-width: 62ch; }
.tour .flowkey { font: 500 12px/1.4 var(--font-mono); color: var(--accent); }
.tour .nav { display: flex; justify-content: space-between; gap: 8px; }
.tour .nav button { min-height: 40px; padding: 0 16px; border-radius: 9px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 500 14px/1 var(--font-ui); cursor: pointer; }

.loading { position: fixed; inset: 0; display: grid; place-items: center; font: 500 13px/1 var(--font-mono); color: var(--muted); letter-spacing: .1em; pointer-events: none; }

body.touring .tools, body.touring .sheet {
  box-shadow: var(--shadow); display: none; }
@media (min-width: 900px) {
  .tour {
  box-shadow: var(--shadow); left: 16px; transform: none; top: calc(124px + env(safe-area-inset-top, 0px)); bottom: auto; width: 330px; }
  .steps { flex-wrap: wrap; }
  .steps button { flex: 1 0 40%; }
}

@media (max-width: 700px) {
  .modes.langs { top: calc(16px + env(safe-area-inset-top, 0px)); bottom: auto; }
  .titleblock h1 { font-size: 18px; }
  .rail {
  box-shadow: var(--shadow); height: 40vh; width: 56px; right: 12px; }
  .sheet {
  box-shadow: var(--shadow); right: 16px; left: 16px; width: auto; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  .modes {
  box-shadow: var(--shadow); top: auto; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); right: 16px; }
  .tools { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  .tour {
  box-shadow: var(--shadow); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

// ---------- Part catalogue (mesh indices come from the STEP conversion) ----------
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
// layer: how many "floors" the part rises when the height slider is at 100%
const PARTS = [
  { id: 'shell', ref: 'H1', name: 'シェル（本体外装）', en: 'shell', meshes: [115], stack: 'shell', ghost: true,

function onModel(gltf) {
  const meshes = [];
  gltf.scene.traverse((o) => { if (o.isMesh) meshes[+o.name.slice(1)] = o; });
  for (const p of PARTS) {
    p.objs = [];
    const box = new THREE.Box3();
    for (const i of p.meshes) {
      const m = meshes[i]; if (!m) continue;
      const hex = (m.userData && m.userData.c) || (m.parent && m.parent.userData && m.parent.userData.c) || '';
      const f = { ...(FINISH[hex] || { metalness: 0, roughness: 0.5 }), ...(MESH_FINISH[i] || {}) };
      m.material = new THREE.MeshPhysicalMaterial({ vertexColors: true, side: THREE.DoubleSide, envMapIntensity: 1, ...f });
      m.castShadow = true; m.receiveShadow = true;
      m.geometry.computeBoundingBox();
      box.union(m.geometry.boundingBox);
      const edges = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry, 32),
        new THREE.LineBasicMaterial({ color: 0x0d1015, transparent: true, opacity: 0.22 }));
      edges.raycast = () => {};
      m.add(edges);
      m.userData.edges = edges;
      const holder = new THREE.Group();
      holder.add(m);
      root.add(holder);
      p.objs.push(m);
      meshParts.set(m, p);
    }
    p.holders = p.objs.map((m) => m.parent);
    partBoxes[p.id] = box;
  }
  computeRises();
  document.getElementById('loading').hidden = true;
  buildCallouts();
  applyLook();
}

// ---------- Explode ----------
function partOffset(p, t) { return t * (p.rise || 0); }
function computeRises() {
  const top = (ps) => Math.max(...ps.map((p) => partBoxes[p.id].max.z + p.rise));
  const bottom = (ps) => Math.min(...ps.map((p) => partBoxes[p.id].min.z));
  const inner = PARTS.filter((p) => !p.stack), shell = PARTS.filter((p) => p.stack === 'shell'), arms = PARTS.filter((p) => p.stack === 'arms');
  for (const p of inner) p.rise = p.layer * LAYER_GAP;
  const shellRise = top(inner) + CLEARANCE - bottom(shell);
  for (const p of shell) p.rise = shellRise;
  const armRise = top(shell) + CLEARANCE - bottom(arms);
  for (const p of arms) p.rise = armRise;
  MAX_OFFSET = Math.max(...PARTS.map((p) => p.rise));
}
function updateExplode() {
  const t = S.explodeShown;
  for (const p of PARTS) if (p.holders) for (const h of p.holders) h.position.z = partOffset(p, t);
}
// world-space anchor on the top of a part (with current explode)
const _v = new THREE.Vector3();
function partPoint(p, where = 'top') {
  const b = partBoxes[p.id];
  _v.set((b.min.x + b.max.x) / 2, (b.min.y + b.max.y) / 2, where === 'top' ? b.max.z : (b.min.z + b.max.z) / 2);
  _v.z += partOffset(p, S.explodeShown);
  return root.localToWorld(_v.clone());
}

function setPartOpacity(p, a) {
  for (const m of p.objs || []) {
    const mat = m.material, see = a < 0.999;
    mat.transparent = see; mat.opacity = a; mat.depthWrite = !see;
    m.castShadow = !see;
    m.userData.edges.material.opacity = 0.22 * a;
    m.renderOrder = see ? 2 : 0;

}
function applyLook() {
  const tour = S.mode === 'tour' ? TOUR[S.step] : null;
  const focus = tour && tour.parts.length ? new Set(tour.parts) : null;
  const ghostShell = tour ? true : S.ghost;
  for (const p of PARTS) {
    let a = 1;
    if (p.ghost && ghostShell) a = 0.1;
    if (focus && !focus.has(p.id)) a = Math.min(a, p.ghost ? 0.06 : 0.16);

      const em = m.userData.edges.material;
      em.color.set(hi ? ACCENT : 0x0d1015);
      if (hi) em.opacity = 0.95;
    }
  }
  for (const c of callouts) c.el.classList.toggle('is-on', S.mode === 'explore' && S.selected === c.part);
  if (callouts.length) layoutCallouts();  // swap labels right away, not on the next frame
}

// ---------- Callouts (leader lines + names) ----------
const svg = document.getElementById('leaders'), labelsEl = document.getElementById('labels');
const callouts = [];
// every part gets a callout; which ones show depends on the mode (see visibleCallouts)
function buildCallouts() {
  for (const p of PARTS) {
    const el = document.createElement('div');
    el.className = 'callout';
    el.addEventListener('click', () => select(p));
    labelsEl.appendChild(el);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('r', 4.5);
    svg.append(path, dot);
    callouts.push({ part: p, el, path, dot });
  }
  renderCalloutText();
}
function renderCalloutText() {
  for (const { part: p, el } of callouts) el.innerHTML = `<span class="ref">${p.ref}</span><b>${P(p, 'name')}</b><small>${P(p, 'sub') || p.en}</small>`;
}
const _p = new THREE.Vector3();
function toScreen(v) { _p.copy(v).project(camera); return { x: (_p.x + 1) / 2 * innerWidth, y: (1 - _p.y) / 2 * innerHeight, z: _p.z }; }
function modelScreenBounds() {
  let minX = Infinity, maxX = -Infinity;
  for (const p of PARTS) {
    const b = partBoxes[p.id]; if (!b) continue;
    const off = partOffset(p, S.explodeShown);
    for (let k = 0; k < 8; k++) {
      const v = new THREE.Vector3(k & 1 ? b.max.x : b.min.x, k & 2 ? b.max.y : b.min.y, (k & 4 ? b.max.z : b.min.z) + off);
      const s = toScreen(root.localToWorld(v));
      minX = Math.min(minX, s.x); maxX = Math.max(maxX, s.x);
    }
  }
  return { minX, maxX, cx: (minX + maxX) / 2 };
}
// しくみ: only the parts the current step talks about.
// 観察: none (tapping a part opens its card instead).
function visibleCallouts() {
  if (S.mode === 'tour') {
    const ids = new Set(TOUR[S.step].labels || TOUR[S.step].parts);
    return callouts.filter((c) => ids.has(c.part.id));
  }
  return [];
}
function layoutCallouts() {
  const items = visibleCallouts();
  for (const c of callouts) { const on = items.includes(c); c.el.hidden = !on; c.path.style.display = c.dot.style.display = on ? '' : 'none'; }
  if (!items.length) return;
  const bounds = modelScreenBounds();
  const placed = items.map((c) => ({ c, a: toScreen(partPoint(c.part)) }));
  const sides = { left: [], right: [] };
  for (const it of placed) sides[it.a.x < bounds.cx ? 'left' : 'right'].push(it);
  // keep one label per side if everything bunched: move the furthest-left of the right group over
  if (!sides.left.length && sides.right.length > 1) sides.left.push(sides.right.sort((a, b) => a.a.x - b.a.x).shift());
  if (!sides.right.length && sides.left.length > 1) sides.right.push(sides.left.sort((a, b) => b.a.x - a.a.x).shift());
  // keep left-hand labels clear of the tour card when it sits on the left
  const tourBox = !tourEl.hidden ? tourEl.getBoundingClientRect() : null;
  const margin = tourBox && tourBox.left < 40 ? tourBox.right + 16 : 16, gapX = 36, minGap = 58;
  const top = 110, bottom = innerHeight - 90;
  for (const side of ['left', 'right']) {
    const list = sides[side].sort((a, b) => a.a.y - b.a.y);
    let lastY = -Infinity;
    for (const it of list) {
      const w = it.c.el.offsetWidth, h = it.c.el.offsetHeight;
      let y = Math.max(top, Math.min(bottom - h, it.a.y - h - 18));
      if (y < lastY + minGap) y = lastY + minGap;
      lastY = y;
      let x = side === 'left' ? Math.min(bounds.minX - gapX - w, it.a.x - 60 - w) : Math.max(bounds.maxX + gapX, it.a.x + 60);
      x = side === 'left' ? Math.max(margin, Math.min(innerWidth - w - 96, x)) : Math.max(16, Math.min(innerWidth - w - 96, x));
      it.c.el.style.transform = `translate(${x}px, ${y}px)`;
      const ey = y + h / 2, ex = side === 'left' ? x + w : x;
      const knee = side === 'left' ? ex + 18 : ex - 18;
      it.c.path.setAttribute('d', `M${it.a.x},${it.a.y} L${knee},${ey} L${ex},${ey}`);
      it.c.dot.setAttribute('cx', it.a.x); it.c.dot.setAttribute('cy', it.a.y);
    }
  }
}

// ---------- Selection ----------
const sheet = document.getElementById('sheet');
function renderSheet(p) {
  document.getElementById('s-ref').textContent = `${p.ref} · ${p.en}`;
  document.getElementById('s-name').textContent = P(p, 'name');
  document.getElementById('s-desc').textContent = P(p, 'desc');
  document.getElementById('s-spec').innerHTML = (P(p, 'spec') || []).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
}
function select(p) {
  S.selected = p;
  if (!p) { sheet.hidden = true; applyLook(); return; }
  renderSheet(p);
  sheet.hidden = false;
  // internal parts sit inside the shell: see-through on so the selection is visible
  if (!p.ghost && !S.ghost) document.getElementById('t-ghost').click();
  applyLook();
}
document.getElementById('sheet-close').addEventListener('click', () => select(null));

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || S.mode !== 'explore') return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t;
  down = null;
  if (moved > 8 || dt > 500) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects([...meshParts.keys()], false).filter((h) => h.object.material.opacity > 0.5);
  select(hits.length ? meshParts.get(hits[0].object) : null);
});

// ---------- Tools ----------
const toggle = (id, fn) => { const b = document.getElementById(id); b.addEventListener('click', () => { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); fn(on); }); };
toggle('t-ghost', (on) => { S.ghost = on; applyLook(); });
toggle('t-spin', (on) => { controls.autoRotate = on; });
let fly = null;
function flyTo(pos, target) { fly = { pos: pos.clone(), target: target.clone() }; }
const viewTargetY = (t) => 20 + t * MAX_OFFSET * 0.5;
const zoomFactor = (t) => 1 + t * MAX_OFFSET / 110;
document.getElementById('t-reset').addEventListener('click', () => {
  const t = S.explodeShown, target = new THREE.Vector3(0, viewTargetY(t), 0);
  flyTo(HOME.pos.clone().sub(HOME.target).multiplyScalar(zoomFactor(t)).add(target), target);
});

// ---------- Modes & tour ----------
const tourEl = document.getElementById('tour'), stepsEl = document.getElementById('steps');
TOUR.forEach((s, i) => {
  const b = document.createElement('button');
  b.addEventListener('click', () => goStep(i));
  stepsEl.appendChild(b);
});
function renderTourText() {
  [...stepsEl.children].forEach((b, i) => { b.innerHTML = `<span>${i + 1}</span>${T(i, 'tab')}`; });
  document.getElementById('tour-title').textContent = T(S.step, 'title');
  document.getElementById('tour-flow').textContent = T(S.step, 'flow');
  document.getElementById('tour-text').textContent = T(S.step, 'text');
}
function setMode(m) {
  S.mode = m;
  document.getElementById('mode-explore').setAttribute('aria-pressed', m === 'explore');
  document.getElementById('mode-tour').setAttribute('aria-pressed', m === 'tour');
  document.body.classList.toggle('touring', m === 'tour');
  tourEl.hidden = m !== 'tour';
  if (m === 'tour') { select(null); goStep(S.step); } else { flow.visible = false; applyLook(); }
}
function goStep(i) {
  S.step = (i + TOUR.length) % TOUR.length;
  const s = TOUR[S.step];
  [...stepsEl.children].forEach((b, k) => k === S.step ? b.setAttribute('aria-current', 'step') : b.removeAttribute('aria-current'));
  renderTourText();
  setExplode(s.explode);
  applyLook();
}

// Language switch: re-renders every text in place (keeps view, step and explode as they are)
function setLang(l) {
  LANG = l;
  try { localStorage.setItem('bd-lang', l); } catch (e) { /* storage blocked: choice lasts this visit */ }
  document.documentElement.lang = l === 'zh' ? 'zh-Hant' : 'ja';
  document.getElementById('lang-ja').setAttribute('aria-pressed', l === 'ja');
  document.getElementById('lang-zh').setAttribute('aria-pressed', l === 'zh');
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    if (el.id === 'loading' && el.hidden) return;
    el.textContent = ui(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-aria]').forEach((el) => el.setAttribute('aria-label', ui(el.dataset.i18nAria)));
  renderTourText();
  renderCalloutText();
  if (S.selected) renderSheet(S.selected);
  if (callouts.length) layoutCallouts();
}
document.getElementById('lang-ja').addEventListener('click', () => setLang('ja'));
document.getElementById('lang-zh').addEventListener('click', () => setLang('zh'));
setLang(LANG);
document.getElementById('mode-explore').addEventListener('click', () => setMode('explore'));
document.getElementById('mode-tour').addEventListener('click', () => setMode('tour'));
document.getElementById('tour-prev').addEventListener('click', () => goStep(S.step - 1));
document.getElementById('tour-next').addEventListener('click', () => goStep(S.step + 1));

// Signal flow: a line through part centres plus pulses travelling along it
const flow = new THREE.Group(); flow.visible = false; scene.add(flow);
const FLOW_N = 96;
const flowLine = new THREE.Line(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(new Float32Array(FLOW_N * 3), 3)),
  new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, depthTest: false }));
flowLine.renderOrder = 10; flow.add(flowLine);
const pulses = Array.from({ length: 5 }, () => {
  const s = new THREE.Mesh(new THREE.SphereGeometry(1.8, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false, transparent: true }));
  s.renderOrder = 11; flow.add(s); return s;
});
function updateFlow(time) {
  const s = TOUR[S.step];
  if (S.mode !== 'tour' || !s.path || s.path.length < 2) { flow.visible = false; return; }
  flow.visible = true;
  const pts = s.path.map((id) => partPoint(byId[id], 'mid'));
  const curvePts = [];
  for (let i = 0; i < pts.length; i++) {
    curvePts.push(pts[i]);
    if (i < pts.length - 1) { const m = pts[i].clone().lerp(pts[i + 1], 0.5); m.y += 10; curvePts.push(m); }
  }
  const curve = new THREE.CatmullRomCurve3(curvePts, false, 'centripetal');
  const arr = flowLine.geometry.attributes.position.array;
  for (let i = 0; i < FLOW_N; i++) curve.getPoint(i / (FLOW_N - 1)).toArray(arr, i * 3);
  flowLine.geometry.attributes.position.needsUpdate = true;
  flowLine.geometry.computeBoundingSphere();
  flowLine.material.color.copy(ACCENT);
  pulses.forEach((p, k) => {
    const u = ((time * 0.00025) + k / pulses.length) % 1;
    curve.getPoint(u, p.position);
    p.material.color.copy(ACCENT);
    p.material.opacity = Math.sin(u * Math.PI);
  });
}

// ---------- Loop ----------
function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  svg.setAttribute('viewBox', `0 0 ${innerWidth} ${innerHeight}`);
  svg.setAttribute('width', innerWidth); svg.setAttribute('height', innerHeight);
}
addEventListener('resize', resize);
resize();

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
renderer.setAnimationLoop((time) => {
  const k = reduce ? 1 : 0.14;
  const prevT = S.explodeShown;
  S.explodeShown += (S.explode - S.explodeShown) * k;
  if (Math.abs(S.explode - S.explodeShown) < 1e-4) S.explodeShown = S.explode;
  readout.innerHTML = `+${Math.round(S.explodeShown * MAX_OFFSET)}<br>mm`;
  updateExplode();
  // keep the growing stack centred and in frame, preserving the user's own zoom
  const dy = (viewTargetY(S.explodeShown) - controls.target.y) * 0.1;
  controls.target.y += dy; camera.position.y += dy;
  if (!fly && prevT !== S.explodeShown) {
    const ratio = zoomFactor(S.explodeShown) / zoomFactor(prevT);
    camera.position.sub(controls.target).multiplyScalar(ratio).add(controls.target);
  }
  if (fly) {
    camera.position.lerp(fly.pos, 0.12); controls.target.lerp(fly.target, 0.12);
    if (camera.position.distanceTo(fly.pos) < 0.5) fly = null;
  }
  controls.update();
  updateFlow(time);
  renderer.render(scene, camera);
  if (callouts.length) layoutCallouts();
});
</script>
