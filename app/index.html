function onModel(gltf) {
  const meshes = [];
  gltf.scene.traverse((o) => { if (o.isMesh) meshes.push(o); });
  const pathOf = (m) => (m.userData && m.userData.path) || '';
  const claimed = new Set();
  // claim order: the most specific selectors first, so the M5's screws / socket are not swallowed by m5
  const order = [...PARTS].sort((a, b) => (a.id === 'm5') - (b.id === 'm5'));
  for (const p of order) p.srcs = meshes.filter((m) => !claimed.has(m) && p.sel.test(pathOf(m)) && claimed.add(m));
  const loose = meshes.filter((m) => !claimed.has(m));
  if (loose.length) console.warn('meshes not in any part:', [...new Set(loose.map(pathOf))]);
  for (const p of PARTS) {
    p.objs = [];
    const box = new THREE.Box3();
    // One draw call per surface finish: every face of the part with the same finish is merged
    // (e.g. the TP4057's 94 solids become a handful of meshes). Looks the same, far fewer draws.
    const byFinish = new Map();
    const over = p.finish === 'gel' ? GEL : p.finish;
    for (const src of p.srcs) {
      if (p.paint) paintGel(src.geometry, p.paint);
      for (const [key, geo] of over ? [['part', src.geometry]] : splitByFinish(src.geometry, pathOf(src))) {
        if (!byFinish.has(key)) byFinish.set(key, { f: over || MAT[key], geos: [] });
        byFinish.get(key).geos.push(geo);
      }
    }
    for (const { f, geos } of byFinish.values()) {
      const geo = geos.length > 1 ? mergeGeometries(geos) : geos[0];
      const m = new THREE.Mesh(geo, finishMaterial(f));
      m.castShadow = true; m.receiveShadow = true;
      m.geometry.computeBoundingBox();
      box.union(m.geometry.boundingBox);
      const edges = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry, 32),
        new THREE.LineBasicMaterial({ color: 0x0d1015, transparent: true, opacity: 0.22 }));
      edges.raycast = () => {};
      edges.visible = !p.paint;  // no CAD outlines on the organic gel
      m.add(edges);
      m.userData.edges = edges;
      const holder = new THREE.Group();
      holder.add(m);
      root.add(holder);
      p.objs.push(m);
      meshParts.set(m, p);
    }
    p.holders = p.objs.map((m) => m.parent);
    partBoxes[p.id] = box;
    if (p.anchor === 'one' && p.srcs.length) {
      // one box per physical unit (e.g. each of the 4 film sensors): merge source meshes that touch
      const units = [];
      for (const src of p.srcs) {
        src.geometry.computeBoundingBox();
        const b = src.geometry.boundingBox.clone();
        for (let k = units.length - 1; k >= 0; k--) if (units[k].clone().expandByScalar(0.5).intersectsBox(b)) b.union(units.splice(k, 1)[0]);
        units.push(b);
      }
      p.units = units;
      p.anchorBox = units.reduce((a, b) => (b.max.x + b.min.x > a.max.x + a.min.x ? b : a));  // right-most
    }
  }
  computeRises();
  S.shadowDirty = true;
  document.getElementById('loading').hidden = true;
  buildCallouts();
  applyLook();
}

// ---------- Explode ----------
function partOffset(p, t) {
  const a = Math.min(1, t / GROUP_SPLIT), b = Math.max(0, (t - GROUP_SPLIT) / (1 - GROUP_SPLIT));
  return a * (p.rise1 || 0) + b * (p.rise2 || 0);
}
const stackRise = (t) => Math.max(...PARTS.map((p) => partOffset(p, t)));  // how far the top block has risen
function computeRises() {
  const top = (ps, r = () => 0) => Math.max(...ps.map((p) => partBoxes[p.id].max.z + r(p)));
  const bottom = (ps) => Math.min(...ps.map((p) => partBoxes[p.id].min.z));
  const of = (k) => PARTS.filter((p) => p.stack === k);
  const cover = of('cover'), brain = of('brain'), shell = of('shell'), sensors = of('sensors'), arms = of('arms'), inner = of(undefined);
  const group = [...inner, ...shell, ...sensors, ...arms];
  // stage 2: the device group comes apart (relative to where stage 1 left it)
  for (const p of inner) p.rise2 = p.layer * LAYER_GAP;
  const shellRise = top(inner, (p) => p.rise2) + CLEARANCE - bottom(shell);
  for (const p of shell) p.rise2 = shellRise;
  const sensorRise = top(shell, (p) => p.rise2) + CLEARANCE - bottom(sensors);
  for (const p of sensors) p.rise2 = sensorRise;
  const armRise = top(sensors, (p) => p.rise2) + CLEARANCE - bottom(arms);
  for (const p of arms) p.rise2 = armRise;
  // stage 1: cover / device group / brain separate as three blocks
  for (const p of cover) { p.rise1 = COVER_LIFT; p.rise2 = 0; }
  const groupRise = top(cover) + COVER_LIFT + CLEARANCE - bottom(group);
  for (const p of group) p.rise1 = groupRise;
  const brainRise = top(group) + groupRise + CLEARANCE - bottom(brain);
  const groupGrowth = top(group, (p) => p.rise2) - top(group);
  for (const p of brain) { p.rise1 = brainRise; p.rise2 = groupGrowth; }
}
function updateExplode() {
  const t = S.explodeShown, rise = stackRise(t);
  for (const p of PARTS) if (p.holders) for (const h of p.holders) {
    h.position.z = partOffset(p, t);
    if (p.showFrom) h.visible = rise >= p.showFrom;
  }
}
// world-space anchor on the top of a part (with current explode)
const _v = new THREE.Vector3();
function partPoint(p, where = 'top', box = null) {
  const b = box || p.anchorBox || partBoxes[p.id];
  _v.set((b.min.x + b.max.x) / 2, (b.min.y + b.max.y) / 2, where === 'top' ? b.max.z : (b.min.z + b.max.z) / 2);
  _v.z += partOffset(p, S.explodeShown);
  return root.localToWorld(_v.clone());
}

for (let i = 0; i <= 6; i++) { const t = document.createElement('div'); t.className = 'tick'; t.style.bottom = (i / 6 * 100) + '%'; track.appendChild(t); }
function setExplode(v) {
  S.explode = Math.min(1, Math.max(0, v));
  thumb.style.bottom = (S.explode * 100) + '%';
  fill.style.height = (S.explode * 100) + '%';
  track.setAttribute('aria-valuenow', Math.round(S.explode * 100));
}
function fromPointer(e) { const r = track.getBoundingClientRect(); setExplode(1 - (e.clientY - r.top) / r.height); }
track.addEventListener('pointerdown', (e) => { track.setPointerCapture(e.pointerId); track.classList.add('dragging'); fromPointer(e); e.preventDefault(); });
for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) track.addEventListener(ev, () => track.classList.remove('dragging'));
track.addEventListener('pointermove', (e) => { if (track.hasPointerCapture(e.pointerId)) fromPointer(e); });
track.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowUp' || e.key === 'ArrowRight') setExplode(S.explode + 0.05);
  else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') setExplode(S.explode - 0.05);
  else return;
  e.preventDefault();
});
setExplode(0);

// ---------- Look: ghosting, highlight ----------
const ACCENT = new THREE.Color();
function readAccent() { ACCENT.set(getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#0088ff'); }
readAccent();

// See-through parts swap to a light material: at 6–16 % opacity clearcoat and sheen are invisible,
// but on iPad they made the ghosted brain (a screen-filling, double-sided body) the slowest thing
// on screen. Standard + one pass for both sides keeps the same colour and env reflections.
function ghostMaterial(m) {
  if (!m.userData.ghostMat) {
    const s = m.userData.solidMat = m.material;
    m.userData.ghostMat = new THREE.MeshStandardMaterial({
      vertexColors: true, side: THREE.DoubleSide, forceSinglePass: true, transparent: true, depthWrite: false,
      metalness: s.metalness, roughness: s.roughness, envMapIntensity: s.envMapIntensity,
    });
  }
  return m.userData.ghostMat;
}
function setPartOpacity(p, a) {
  for (const m of p.objs || []) {
    const see = a < 0.999;
    if (see) m.material = ghostMaterial(m);
    else if (m.userData.solidMat) m.material = m.userData.solidMat;
    const mat = m.material;
    mat.opacity = a;
    if (m.castShadow === see) S.shadowDirty = true;
    m.castShadow = !see;
    m.receiveShadow = !see;  // soft-shadow lookups per pixel, invisible at this opacity
    m.userData.edges.material.opacity = 0.22 * a;
    m.renderOrder = see ? 2 : 0;
  }
}
function applyLook() {
  const tour = S.mode === 'tour' ? TOUR[S.step] : null;
  const focus = tour && tour.parts.length ? new Set(tour.parts) : null;
  const ghostShell = tour ? true : S.ghost;
  for (const p of PARTS) {
    let a = 1;
    if (p.ghost && ghostShell) a = 0.1;
    if (focus && !focus.has(p.id)) a = Math.min(a, p.ghost ? 0.06 : 0.16);
    setPartOpacity(p, a);
    // a faint glow only: keep the real part colours readable
    const hi = S.mode === 'explore' && S.selected === p;
    for (const m of p.objs || []) {
      m.material.emissive.copy(hi ? ACCENT : new THREE.Color(0)); m.material.emissiveIntensity = hi ? 0.04 : 0;
      const em = m.userData.edges.material;
      em.color.set(hi ? ACCENT : 0x0d1015);
      if (hi) em.opacity = 0.95;
    }
  }
  for (const c of callouts) c.el.classList.toggle('is-on', S.mode === 'explore' && S.selected === c.part);
  if (callouts.length) layoutCallouts();  // swap labels right away, not on the next frame
}

// ---------- Callouts (leader lines + names) ----------
const svg = document.getElementById('leaders'), labelsEl = document.getElementById('labels');
const callouts = [];
// every part gets a callout; which ones show depends on the mode (see visibleCallouts)
function buildCallouts() {
  for (const p of PARTS) {
    const el = document.createElement('div');
    el.className = 'callout glass';
    el.addEventListener('click', () => select(p));
    labelsEl.appendChild(el);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('r', 4.5);
    svg.append(path, dot);
    callouts.push({ part: p, el, path, dot });
  }
  renderCalloutText();
}
function renderCalloutText() {
  for (const { part: p, el } of callouts) el.innerHTML = `<span class="ref">${p.ref}</span><b>${P(p, 'name')}</b><small>${P(p, 'sub') || p.en}</small>`;
}
const _p = new THREE.Vector3();
function toScreen(v) { _p.copy(v).project(camera); return { x: (_p.x + 1) / 2 * innerWidth, y: (1 - _p.y) / 2 * innerHeight, z: _p.z }; }
function modelScreenBounds() {
  let minX = Infinity, maxX = -Infinity;
  for (const p of PARTS) {
    const b = partBoxes[p.id]; if (!b) continue;
    const off = partOffset(p, S.explodeShown);
    for (let k = 0; k < 8; k++) {
      const v = new THREE.Vector3(k & 1 ? b.max.x : b.min.x, k & 2 ? b.max.y : b.min.y, (k & 4 ? b.max.z : b.min.z) + off);
      const s = toScreen(root.localToWorld(v));
      minX = Math.min(minX, s.x); maxX = Math.max(maxX, s.x);
    }
  }
  return { minX, maxX, cx: (minX + maxX) / 2 };
}
// しくみ: only the parts the current step talks about.
// 観察: none (tapping a part opens its card instead).
function visibleCallouts() {
  if (S.mode === 'tour') {
    const ids = new Set(TOUR[S.step].labels || TOUR[S.step].parts);
    return callouts.filter((c) => ids.has(c.part.id));
  }
  return [];
}
function layoutCallouts() {
  const items = visibleCallouts();
  for (const c of callouts) { const on = items.includes(c); c.el.hidden = !on; c.path.style.display = c.dot.style.display = on ? '' : 'none'; }
  if (!items.length) return;
  const bounds = modelScreenBounds();
  const placed = items.map((c) => ({ c, a: toScreen(partPoint(c.part)) }));
  const sides = { left: [], right: [] };
  for (const it of placed) sides[it.a.x < bounds.cx ? 'left' : 'right'].push(it);
  // keep one label per side if everything bunched: move the furthest-left of the right group over
  if (!sides.left.length && sides.right.length > 1) sides.left.push(sides.right.sort((a, b) => a.a.x - b.a.x).shift());
  if (!sides.right.length && sides.left.length > 1) sides.right.push(sides.left.sort((a, b) => b.a.x - a.a.x).shift());
  // keep left-hand labels clear of the tour card when it sits on the left
  const tourBox = !tourEl.hidden ? tourEl.getBoundingClientRect() : null;
  const margin = tourBox && tourBox.left < 40 ? tourBox.right + 16 : 16, gapX = 36, minGap = 58;
  const top = 110, bottom = innerHeight - 90;
  for (const side of ['left', 'right']) {
    const list = sides[side].sort((a, b) => a.a.y - b.a.y);
    let lastY = -Infinity;
    for (const it of list) {
      const w = it.c.el.offsetWidth, h = it.c.el.offsetHeight;
      let y = Math.max(top, Math.min(bottom - h, it.a.y - h - 18));
      if (y < lastY + minGap) y = lastY + minGap;
      lastY = y;
      let x = side === 'left' ? Math.min(bounds.minX - gapX - w, it.a.x - 60 - w) : Math.max(bounds.maxX + gapX, it.a.x + 60);
      x = side === 'left' ? Math.max(margin, Math.min(innerWidth - w - 96, x)) : Math.max(16, Math.min(innerWidth - w - 96, x));
      it.c.el.style.transform = `translate(${x}px, ${y}px)`;
      const ey = y + h / 2, ex = side === 'left' ? x + w : x;
      const knee = side === 'left' ? ex + 18 : ex - 18;
      it.c.path.setAttribute('d', `M${it.a.x},${it.a.y} L${knee},${ey} L${ex},${ey}`);
      it.c.dot.setAttribute('cx', it.a.x); it.c.dot.setAttribute('cy', it.a.y);
    }
  }
}

// ---------- Selection ----------
const sheet = document.getElementById('sheet');

  renderSheet(p);

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || S.mode !== 'explore') return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t;
  down = null;
  if (moved > 8 || dt > 500) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects([...meshParts.keys()], false).filter((h) => h.object.material.opacity > 0.5 && h.object.parent.visible);
  select(hits.length ? meshParts.get(hits[0].object) : null);
});

});

// Signal flow: a line through part centres plus pulses travelling along it. A path that starts at a
// part made of several units (the 4 pressure sensors) branches: one line from each unit.
const flow = new THREE.Group(); flow.visible = false; scene.add(flow);
const FLOW_N = 96, FLOW_MAX = 4, PULSES = 5;
const flowLines = Array.from({ length: FLOW_MAX }, () => {
  const line = new THREE.Line(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(new Float32Array(FLOW_N * 3), 3)),
    new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, depthTest: false }));
  line.renderOrder = 10; flow.add(line);
  line.pulses = Array.from({ length: PULSES }, () => {
    const s = new THREE.Mesh(new THREE.SphereGeometry(1.8, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false, transparent: true }));
    s.renderOrder = 11; flow.add(s); return s;
  });
  return line;
});
function updateFlow(time) {
  const s = TOUR[S.step];
  if (S.mode !== 'tour' || !s.path || s.path.length < 2) { flow.visible = false; return; }
  flow.visible = true;
  const first = byId[s.path[0]];
  const starts = (first.units || [null]).slice(0, FLOW_MAX).map((box) => partPoint(first, 'mid', box));
  const rest = s.path.slice(1).map((id) => partPoint(byId[id], 'mid'));
  flowLines.forEach((line, n) => {
    const on = n < starts.length;
    line.visible = on; line.pulses.forEach((p) => { p.visible = on; });
    if (!on) return;
    const pts = [starts[n], ...rest], curvePts = [];
    for (let i = 0; i < pts.length; i++) {
      curvePts.push(pts[i]);
      if (i < pts.length - 1) { const m = pts[i].clone().lerp(pts[i + 1], 0.5); m.y += 10; curvePts.push(m); }
    }
    const curve = new THREE.CatmullRomCurve3(curvePts, false, 'centripetal');
    const arr = line.geometry.attributes.position.array;
    for (let i = 0; i < FLOW_N; i++) curve.getPoint(i / (FLOW_N - 1)).toArray(arr, i * 3);
    line.geometry.attributes.position.needsUpdate = true;
    line.geometry.computeBoundingSphere();
    line.material.color.copy(ACCENT);
    line.pulses.forEach((p, k) => {
      const u = ((time * 0.00025) + k / PULSES + n * 0.13) % 1;  // branches slightly out of step
      curve.getPoint(u, p.position);
      p.material.color.copy(ACCENT);
      p.material.opacity = Math.sin(u * Math.PI);
    });
  });
}

// ---------- Liquid Glass (WebGL) ----------
// Approach from the community web recreations (kube.io write-up, archisvaze/liquid-glass WebGL
// renderer): the 3D scene is rendered to a texture, then one full-screen pass draws every visible
// `.glass` element as a rounded-rect lens over it. The bezel follows a convex squircle profile,
// refraction offset comes from Snell's law, the body is a mip-blurred, whitened sample, and a
// directional specular rim sits on the edge. SVG backdrop filters only work in Chromium, so this
// is what makes the effect real on iPad Safari. Falls back to the CSS blur when unavailable.
const GLASS_MAX = 16;
const useGLGlass = renderer.capabilities.isWebGL2 && !matchMedia('(prefers-reduced-transparency: reduce)').matches;
const hdr = renderer.extensions.has('EXT_color_buffer_float') || renderer.extensions.has('EXT_color_buffer_half_float');
const sceneRT = new THREE.WebGLRenderTarget(1, 1, {
  samples: 4, type: hdr ? THREE.HalfFloatType : THREE.UnsignedByteType,
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, generateMipmaps: false,
});
// The frosted glass samples a blurred copy. Building mipmaps of the full-res scene every frame is
// costly on iPad, so the scene is box-filtered down to 1/4 size first and the mips are built there.
// The same LOD bias then lands on the same blur level (a 1/4-size texture starts 2 mip levels down).
const smallRT = new THREE.WebGLRenderTarget(1, 1, {
  type: hdr ? THREE.HalfFloatType : THREE.UnsignedByteType,
  minFilter: THREE.LinearMipmapLinearFilter, magFilter: THREE.LinearFilter, generateMipmaps: true,
});
const downMat = new THREE.ShaderMaterial({
  depthTest: false, depthWrite: false, blending: THREE.NoBlending,
  uniforms: { uScene: { value: sceneRT.texture }, uTexel: { value: new THREE.Vector2(1, 1) } },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() { vUv = position.xy * 0.5 + 0.5; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  // 4 bilinear taps at +-1 texel = the exact average of the 4x4 block under each output pixel
  fragmentShader: /* glsl */`
    uniform sampler2D uScene; uniform vec2 uTexel; varying vec2 vUv;
    void main() {
      gl_FragColor = 0.25 * (texture2D(uScene, vUv + vec2(-uTexel.x, -uTexel.y)) + texture2D(uScene, vUv + vec2(uTexel.x, -uTexel.y))
                           + texture2D(uScene, vUv + vec2(-uTexel.x,  uTexel.y)) + texture2D(uScene, vUv + vec2(uTexel.x,  uTexel.y)));
    }`,
});
const downScene = new THREE.Scene();
const downQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), downMat);
downQuad.frustumCulled = false;
downScene.add(downQuad);
const glassMat = new THREE.ShaderMaterial({
  depthTest: false, depthWrite: false,
  uniforms: {
    uScene: { value: sceneRT.texture }, uSmall: { value: smallRT.texture }, uRes: { value: new THREE.Vector2(1, 1) }, uDpr: { value: 1 },
    uCount: { value: 0 },
    uRects: { value: Array.from({ length: GLASS_MAX }, () => new THREE.Vector4()) },
    uRadii: { value: new Array(GLASS_MAX).fill(0) },
    uIOR: { value: 1.5 }, uThick: { value: 28 }, uBezel: { value: 18 },
    uTint: { value: 0.32 }, uSpec: { value: 0.55 }, uBlur: { value: 3.2 },
  },
  vertexShader: /* glsl */`
    void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D uScene, uSmall;
    uniform vec2 uRes; uniform float uDpr; uniform int uCount;
    uniform vec4 uRects[${GLASS_MAX}]; uniform float uRadii[${GLASS_MAX}];
    uniform float uIOR, uThick, uBezel, uTint, uSpec, uBlur;

    vec3 toLin(vec3 c) { return pow(c, vec3(2.2)); }
    // same soft studio backdrop as the CSS body background (sRGB authored, composed in linear)
    vec3 backdrop(vec2 uv) {
      vec2 p = vec2(uv.x, 1.0 - uv.y); float asp = uRes.x / uRes.y;
      float d = length((p - vec2(0.45, 0.45)) * vec2(asp, 1.0) / vec2(0.9 * asp, 0.8));
      vec3 c = mix(vec3(1.0), vec3(0.961, 0.961, 0.969), smoothstep(0.0, 0.45, d));
      c = mix(c, vec3(0.910, 0.910, 0.929), smoothstep(0.45, 1.0, d));
      float b = length((p - vec2(0.7, 0.2)) * vec2(asp, 1.0) / vec2(0.6 * asp, 0.5));
      c = mix(c, vec3(0.0, 0.533, 1.0), 0.07 * (1.0 - smoothstep(0.0, 0.7, b)));
      float o = length((p - vec2(0.15, 0.85)) * vec2(asp, 1.0) / vec2(0.5 * asp, 0.45));
      c = mix(c, vec3(1.0, 0.584, 0.0), 0.05 * (1.0 - smoothstep(0.0, 0.7, o)));
      return toLin(c);
    }
    // scene texture is premultiplied, linear, not yet tone-mapped; bias > 0 reads the blurred copy
    vec3 sceneAt(vec2 uv, float bias) {
      uv = clamp(uv, vec2(0.0), vec2(1.0));
      vec4 s = bias > 0.0 ? texture2D(uSmall, uv, bias) : texture2D(uScene, uv);
      vec3 c = s.a > 0.0001 ? toneMapping(s.rgb / s.a) : vec3(0.0);
      return c * s.a + backdrop(uv) * (1.0 - s.a);
    }
    float sdRR(vec2 p, vec2 h, float r) {
      vec2 q = abs(p) - h + r;
      return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
    }
    float surf(float t) { float s = 1.0 - t; return pow(1.0 - s * s * s * s, 0.25); }  // convex squircle

    void main() {
      vec2 frag = gl_FragCoord.xy;
      vec2 uv = frag / uRes;
      float best = 1e9, shadow = 1e9, rB = 0.0; vec2 pB = vec2(0.0), hB = vec2(1.0);
      for (int i = 0; i < ${GLASS_MAX}; i++) {
        if (i >= uCount) break;
        vec4 R = uRects[i]; float r = uRadii[i];
        vec2 p = frag - R.xy;
        float sd = sdRR(p, R.zw, r);
        if (sd < best) { best = sd; pB = p; hB = R.zw; rB = r; }
        shadow = min(shadow, sdRR(p + vec2(0.0, 5.0 * uDpr), R.zw, r));
      }
      vec3 col = sceneAt(uv, 0.0);
      // soft contact shadow below each floating pane
      float sh = exp(-max(shadow, 0.0) * max(shadow, 0.0) / (420.0 * uDpr * uDpr));
      col *= 1.0 - 0.09 * sh * step(0.0, best);

      if (best < 0.0) {
        float dist = -best;
        float bezel = max(min(uBezel * uDpr, min(rB, min(hB.x, hB.y)) - 1.0), 1.0);
        float thick = uThick * uDpr;
        float t = clamp(dist / bezel, 0.0, 1.0);
        float h = surf(t);
        float dh = (surf(min(t + 0.002, 1.0)) - h) / 0.002;
        float slope = atan(dh * thick / bezel);
        float thetaR = asin(clamp(sin(slope) / uIOR, -1.0, 1.0));
        float disp = h * thick * (tan(slope) - tan(thetaR));
        vec2 grad = normalize(vec2(sdRR(pB + vec2(0.5, 0.0), hB, rB) - best, sdRR(pB + vec2(0.0, 0.5), hB, rB) - best) + 1e-6);
        vec2 off = -grad * disp / uRes;
        // frosted body: mip blur + a few taps, slight dispersion on the bezel
        vec2 px = uDpr * 5.0 / uRes;
        vec3 g = sceneAt(uv + off, uBlur) * 0.4
               + sceneAt(uv + off + vec2( px.x,  px.y), uBlur) * 0.15
               + sceneAt(uv + off + vec2(-px.x,  px.y), uBlur) * 0.15
               + sceneAt(uv + off + vec2( px.x, -px.y), uBlur) * 0.15
               + sceneAt(uv + off + vec2(-px.x, -px.y), uBlur) * 0.15;

        g.r = mix(g.r, sceneAt(uv + off * 1.12, uBlur).r, edge * 0.6);
        g.b = mix(g.b, sceneAt(uv + off * 0.88, uBlur).b, edge * 0.6);

const glassScene = new THREE.Scene();
const glassQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), glassMat);
glassQuad.frustumCulled = false;

const glassCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const glassRadius = new WeakMap();
if (useGLGlass) document.body.classList.add('gl-glass');

// read every visible .glass element's rect (device px, y up) into the shader uniforms
function updateGlassRects() {
  const dpr = renderer.getPixelRatio(), H = innerHeight, u = glassMat.uniforms;
  let n = 0;
  for (const el of document.querySelectorAll('.glass')) {
    if (n >= GLASS_MAX || !el.getClientRects().length) continue;
    const r = el.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) continue;
    if (!glassRadius.has(el)) glassRadius.set(el, parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0);
    const rad = Math.min(glassRadius.get(el), r.width / 2, r.height / 2);
    u.uRects.value[n].set((r.left + r.width / 2) * dpr, (H - r.top - r.height / 2) * dpr, r.width / 2 * dpr, r.height / 2 * dpr);
    u.uRadii.value[n] = rad * dpr;
    n++;

  u.uCount.value = n;

// ---------- Loop ----------
function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  const buf = renderer.getDrawingBufferSize(new THREE.Vector2());
  sceneRT.setSize(buf.x, buf.y);
  smallRT.setSize(Math.ceil(buf.x / 4), Math.ceil(buf.y / 4));
  downMat.uniforms.uTexel.value.set(1 / buf.x, 1 / buf.y);
  glassMat.uniforms.uRes.value.copy(buf);
  glassMat.uniforms.uDpr.value = renderer.getPixelRatio();
  svg.setAttribute('viewBox', `0 0 ${innerWidth} ${innerHeight}`);
  svg.setAttribute('width', innerWidth); svg.setAttribute('height', innerHeight);

addEventListener('resize', resize);
resize();

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
renderer.setAnimationLoop((time) => {
  const k = reduce ? 1 : 0.14;
  const prevT = S.explodeShown;
  S.explodeShown += (S.explode - S.explodeShown) * k;
  if (Math.abs(S.explode - S.explodeShown) < 1e-4) S.explodeShown = S.explode;
  // touch the DOM only when the number changes (a write before the glass rect reads forces a layout)
  const mm = Math.round(stackRise(S.explodeShown));
  if (mm !== S.readoutMm) { S.readoutMm = mm; readout.innerHTML = `+${mm}<br>mm`; }
  if (prevT !== S.explodeShown) S.shadowDirty = true;
  updateExplode();
  // while the stack grows or shrinks, move the view by the same amount so it stays in frame.
  // Only the change is applied, so wherever the user has panned / zoomed to is kept.
  if (!fly && prevT !== S.explodeShown) {
    const dy = viewTargetY(S.explodeShown) - viewTargetY(prevT);
    controls.target.y += dy; camera.position.y += dy;
    const ratio = zoomFactor(S.explodeShown) / zoomFactor(prevT);
    camera.position.sub(controls.target).multiplyScalar(ratio).add(controls.target);

  if (fly) {

    renderer.setRenderTarget(sceneRT);
    renderer.setClearColor(0x000000, 0);
    renderer.clear();
    renderer.render(scene, camera);
    renderer.setRenderTarget(smallRT);
    renderer.render(downScene, glassCam);
    renderer.setRenderTarget(null);
    updateGlassRects();
    renderer.render(glassScene, glassCam);
  } else {
    renderer.render(scene, camera);
  }
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
